<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1720" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby">
<title>Baby tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f7efe9;--card:#fff;--ink:#231c24;--mute:#6b5f69;--line:#e6d9d1;--pri:#7a3e8f;--priink:#fff;--feed:#fde4d8;--diaper:#dcefff;--mom:#f3e1f7;--ok:#1f7a4a;--warn:#a35a00;--bad:#b3261e;--badbg:#fde7e5;--chip:#f1e6df;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1720;--card:#28222e;--ink:#f3ecf2;--mute:#b8aab5;--line:#3d3444;--pri:#c99be0;--priink:#1b1720;--feed:#4a3128;--diaper:#22384d;--mom:#3d2a47;--ok:#7fd7a5;--warn:#f0b35c;--bad:#ff8a80;--badbg:#4a2422;--chip:#352d3c;--shadow:none}}
:root[data-theme=dark]{--bg:#1b1720;--card:#28222e;--ink:#f3ecf2;--mute:#b8aab5;--line:#3d3444;--pri:#c99be0;--priink:#1b1720;--feed:#4a3128;--diaper:#22384d;--mom:#3d2a47;--ok:#7fd7a5;--warn:#f0b35c;--bad:#ff8a80;--badbg:#4a2422;--chip:#352d3c;--shadow:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
#main{max-width:560px;margin:0 auto;padding:12px 14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1{font-size:30px;margin:0;line-height:1.1}h2{font-size:21px;margin:22px 0 10px}h3{font-size:18px;margin:16px 0 8px}
.sub,.small{color:var(--mute);font-size:16px}.tiny{color:var(--mute);font-size:14px;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:6px}
.danger-btn{background:var(--badbg);color:var(--bad);border:2px solid var(--bad);border-radius:14px;padding:10px 12px;font-weight:700;font-size:16px;min-height:48px;white-space:nowrap}
.statusrow{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;gap:8px}
.pill{font-size:14px;color:var(--mute)}.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
.linkish{background:none;border:0;color:var(--mute);font-size:15px;padding:8px 0;min-height:44px;text-align:right}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left;box-shadow:var(--shadow);display:block;width:100%}
.cards .card:last-child{grid-column:1/-1}
.card.alert{border:2px solid var(--bad);background:var(--badbg)}
.clabel{font-size:14px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.cbig{font-size:23px;font-weight:700;margin:2px 0}
.quick{display:grid;gap:10px;margin:14px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.qbtn{min-height:86px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);position:relative;padding:8px}
.qbtn .qi{font-size:28px;line-height:1}.qbtn.feed{background:var(--feed)}.qbtn.diaper{background:var(--diaper)}.qbtn.mom{background:var(--mom)}
.qbtn.on{outline:4px solid var(--pri);outline-offset:-4px}
.hint{position:absolute;top:6px;right:8px;font-size:12px;background:var(--pri);color:var(--priink);border-radius:8px;padding:1px 6px;font-weight:600}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:20px;padding:14px;margin:10px 0;border:2px solid var(--pri);background:var(--card)}
.banner.feedb{background:var(--feed)}.btitle{font-weight:700}.bclock{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
.bbtns{display:flex;flex-direction:column;gap:8px}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:10px 16px;font-weight:600;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.btn.danger{background:var(--badbg);color:var(--bad);border:2px solid var(--bad)}
.btn.ghost{background:transparent}.btn.big{min-height:60px;font-size:18px}.btn.wide{display:flex;width:100%;margin:8px 0}
.iconbtn{min-width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.entry{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:56px}
.entry.note{grid-template-columns:1fr}.entry.note .emeta{text-align:left}
.ico{font-size:22px}.etext{font-weight:550}.enote{display:block;color:var(--mute);font-weight:400;font-size:15px}
.emeta{color:var(--mute);font-size:14px;text-align:right}
.dayhead{color:var(--mute);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:48px;border-radius:24px;border:1px solid var(--line);background:var(--chip);padding:8px 14px;font-size:16px;font-weight:550;display:inline-flex;align-items:center}
.chip.small{min-height:40px;font-size:15px}.chip.big{min-height:56px;font-size:18px;padding:10px 18px}
.chip.sel,.chip.radio:has(input:checked){background:var(--pri);color:var(--priink);border-color:var(--pri)}
.chip.added{opacity:.55}.chip.radio input{position:absolute;opacity:0;width:1px;height:1px}
.chip.radio:focus-within{outline:3px solid var(--pri)}
.medrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.medrow.late{border:2px solid var(--bad);background:var(--badbg)}.medname{font-weight:700;font-size:20px}.duenow{color:var(--bad);font-weight:700}
.medbtns{display:flex;gap:6px;align-items:center}
.medpick{flex-direction:column;align-items:flex-start}.medpick.late{border:2px solid var(--bad)}
.water{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.addform{display:flex;gap:8px;margin:12px 0 4px}.addform .bigin{flex:1}
.bigin{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:12px 14px;font-size:18px}
.bigin:focus{border-color:var(--pri);outline:none}
.noteform{display:grid;gap:10px;margin:12px 0}
.shoprow{display:flex;gap:8px;align-items:center}
.check{flex:1;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:60px;text-align:left}
.box{flex:none;width:32px;height:32px;border-radius:9px;border:2.5px solid var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--priink)}
.done .box{background:var(--pri)}.done .stext{text-decoration:line-through;color:var(--mute)}
.stext .tiny{text-decoration:none}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav#nav button{background:none;border:0;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--mute);gap:2px}
nav#nav button span{font-size:24px}nav#nav button[aria-current=page]{color:var(--pri)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;transform:translateY(30px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .2s,opacity .2s,visibility .2s;z-index:6;font-size:16px}
#toast.show{transform:none;opacity:1;visibility:visible;pointer-events:auto}#toast span{flex:1}
#toast button{background:transparent;color:var(--bg);border:1.5px solid var(--bg);border-radius:10px;min-height:44px;padding:4px 12px;font-weight:700}
#sheet{position:fixed;inset:0;z-index:10}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheetbox{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:1}.sheethead h2{margin:0}
.sheetbtns{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}
.fld{display:block;border:0;padding:0;margin:12px 0}.fld>span,.fld legend{display:block;font-weight:600;margin-bottom:6px;font-size:16px}
.fld input:not([type=radio]):not([type=checkbox]),.fld textarea{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:10px 12px;font-size:18px}
.checkf{display:flex;align-items:center;gap:12px;min-height:52px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.checkf input{width:28px;height:28px;accent-color:var(--pri)}
.warnlist{padding-left:22px;margin:6px 0}.warnlist li{margin:6px 0}
.red{color:var(--bad)}.amber{color:var(--warn)}
.bigwarn{font-size:19px;font-weight:650}
.linkbox{word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;user-select:all;-webkit-user-select:all}
details{margin:10px 0}summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.landing{padding-top:40px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:360px){body{font-size:17px}.qbtn{font-size:17px}.row3 .qbtn{font-size:16px}}
</style>
</head>
<body>
<main id="main" aria-live="polite"><p style="padding:40px 0;color:#888">Loading…</p></main>
<nav id="nav" hidden aria-label="Sections">
  <button data-act="tab" data-tab="today"><span aria-hidden="true">🏠</span>Today</button>
  <button data-act="tab" data-tab="mom"><span aria-hidden="true">💗</span>Mom</button>
  <button data-act="tab" data-tab="shop"><span aria-hidden="true">🛒</span>Shop</button>
  <button data-act="tab" data-tab="notes"><span aria-hidden="true">📝</span>Notes</button>
  <button data-act="tab" data-tab="more"><span aria-hidden="true">☰</span>More</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
